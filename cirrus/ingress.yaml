# NOTE: assumes cert-manager (letsencrypt-production ClusterIssuer) and
# external-dns (Cloudflare, carlboettiger.info zone) are configured on cirrus —
# same assumptions as mcp-data-server's cirrus ingress. external-dns provisions
# the A record from spec.rules.host; cert-manager mints the TLS cert into
# open-llm-proxy-tls.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-llm-proxy-ingress
  namespace: llm-proxy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    # <namespace>-<name>@kubernetescrd — see middleware.yaml.
    traefik.ingress.kubernetes.io/router.middlewares: llm-proxy-llm-proxy-cors@kubernetescrd
    traefik.ingress.kubernetes.io/service.servertransport: llm-proxy-llm-proxy-long-timeout@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: llm-proxy.carlboettiger.info
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-llm-proxy
                port:
                  number: 8002
  tls:
    - hosts:
        - llm-proxy.carlboettiger.info
      secretName: open-llm-proxy-tls
