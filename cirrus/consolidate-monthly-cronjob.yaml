# Monthly log rollup for the cirrus deployment. Same script as NRP
# (../consolidate_logs.py, git-cloned at start); MinIO env instead of Ceph.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: logs-consolidate-monthly
  namespace: llm-proxy
  labels:
    app: logs-consolidate
spec:
  # 04:00 UTC on day 2 of each month — after the daily job has closed out the
  # final day of the previous month.
  schedule: "0 4 2 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: cirrus
          initContainers:
            - name: git-sync
              image: alpine/git:latest
              command:
                - sh
                - -c
                - git clone --depth 1 https://github.com/boettiger-lab/open-llm-proxy.git /app
              volumeMounts:
                - name: app-code
                  mountPath: /app
          containers:
            - name: rollup
              image: python:3.12-slim
              workingDir: /app
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: logs-s3, key: AWS_ACCESS_KEY_ID } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: logs-s3, key: AWS_SECRET_ACCESS_KEY } }
                - name: LOG_BUCKET
                  value: "logs-open-llm-proxy"
                - name: S3_ENDPOINT_URL
                  value: "http://minio-svc.minio.svc.cluster.local:9000"
                - name: S3_URL_STYLE
                  value: "path"
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  pip install --quiet duckdb boto3
                  python consolidate_logs.py --tier monthly
              volumeMounts:
                - name: app-code
                  mountPath: /app
              resources:
                requests:
                  cpu: "500m"
                  memory: "2Gi"
                limits:
                  cpu: "500m"
                  memory: "4Gi"
          volumes:
            - name: app-code
              emptyDir: {}
