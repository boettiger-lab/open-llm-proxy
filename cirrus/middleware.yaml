# Traefik CRDs backing the cirrus ingress.
#
# On NRP, CORS and the long timeouts are HAProxy ingress annotations
# (../ingress.yaml); Traefik expresses the same behaviour as first-class CRDs
# referenced from the Ingress via `router.middlewares` /
# `service.servertransport`. Same split as mcp-data-server's cirrus recipe.
---
# CORS. As on NRP, the ingress is the effective authority: Traefik *sets* (not
# appends) these headers, so it overwrites anything the app's own CORSMiddleware
# produced — verified with an `*.nrp-nautilus.io` Origin, the one case where that
# middleware is active, which returns a single `access-control-allow-origin: *`.
# Unlike HAProxy's cors-allow-headers, Traefik's list is explicit too: a new
# custom request header (e.g. X-Client,
# X-Session-Id) must be added below or the preflight fails and the ENTIRE
# request is blocked, not just that header. Verify with:
#   curl -i -X OPTIONS https://llm-proxy.carlboettiger.info/v1/chat/completions \
#     -H "Origin: https://example.org" \
#     -H "Access-Control-Request-Method: POST" \
#     -H "Access-Control-Request-Headers: authorization,content-type,x-client,x-session-id"
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: llm-proxy-cors
  namespace: llm-proxy
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - POST
      - OPTIONS
    accessControlAllowHeaders:
      - DNT
      - User-Agent
      - X-Requested-With
      - If-Modified-Since
      - Cache-Control
      - Content-Type
      - Range
      - Accept
      - Accept-Encoding
      - Accept-Language
      - Origin
      - Referer
      - Priority
      - Authorization
      - X-Client
      - X-Session-Id
    accessControlAllowOriginList:
      - "*"
    # Mirrors the NRP ingress: credentials off, since auth is a bearer token in
    # the Authorization header, not a cookie.
    accessControlAllowCredentials: false
    accessControlMaxAge: 600
    addVaryHeader: true
---
# Long backend timeouts. The proxy calls upstream NON-streaming, so a long
# generation leaves the backend silent for minutes; anything under ~600s cuts
# real completions off mid-answer (cf. #82 on the NRP side). Raised to 1200s to
# match the proxy's own upstream budget (`UPSTREAM_TIMEOUT_SECONDS` default, #135)
# — leaving these at 600s would just relocate the binding cap to this hop.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: llm-proxy-long-timeout
  namespace: llm-proxy
spec:
  forwardingTimeouts:
    dialTimeout: 30s
    idleConnTimeout: 1200s
    readIdleTimeout: 1200s
    responseHeaderTimeout: 1200s
