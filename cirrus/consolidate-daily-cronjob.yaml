# Daily log consolidation for the cirrus deployment. Same script as NRP
# (../consolidate_logs.py, git-cloned at start) — only the env differs: MinIO
# instead of Rook/Ceph, and the scoped `logs-s3` service account instead of the
# namespace `aws` secret.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: logs-consolidate-daily
  namespace: llm-proxy
  labels:
    app: logs-consolidate
spec:
  # 03:00 UTC daily: each completed YYYY-MM-DD/ of JSONL chunks becomes one
  # consolidated/daily/YYYY-MM-DD.parquet + sessions/daily/YYYY-MM-DD.parquet,
  # then the chunks are deleted. Idempotent; always skips today.
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: Never
          # MinIO is pinned to cirrus; keep the read/write traffic on-node.
          nodeSelector:
            kubernetes.io/hostname: cirrus
          initContainers:
            - name: git-sync
              image: alpine/git:latest
              command:
                - sh
                - -c
                - git clone --depth 1 https://github.com/boettiger-lab/open-llm-proxy.git /app
              volumeMounts:
                - name: app-code
                  mountPath: /app
          containers:
            - name: consolidate
              image: python:3.12-slim
              workingDir: /app
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: logs-s3, key: AWS_ACCESS_KEY_ID } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: logs-s3, key: AWS_SECRET_ACCESS_KEY } }
                - name: LOG_BUCKET
                  value: "logs-open-llm-proxy"
                - name: S3_ENDPOINT_URL
                  value: "http://minio-svc.minio.svc.cluster.local:9000"
                - name: S3_URL_STYLE
                  value: "path"
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  pip install --quiet duckdb boto3
                  python consolidate_logs.py --tier daily
              volumeMounts:
                - name: app-code
                  mountPath: /app
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "500m"
                  memory: "2Gi"
          volumes:
            - name: app-code
              emptyDir: {}
