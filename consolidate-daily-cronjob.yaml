apiVersion: batch/v1
kind: CronJob
metadata:
  name: logs-consolidate-daily
  labels:
    app: logs-consolidate
spec:
  # 03:00 UTC every day — consolidates each completed YYYY-MM-DD/ directory
  # of JSONL chunks into one consolidated/daily/YYYY-MM-DD.parquet and deletes
  # the originals. Idempotent: skips days that already have a Parquet and
  # always skips today (still being written).
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          priorityClassName: opportunistic
          restartPolicy: Never
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: feature.node.kubernetes.io/pci-10de.present
                        operator: NotIn
                        values: ["true"]
          containers:
            - name: consolidate
              image: python:3.12-slim
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: aws, key: AWS_ACCESS_KEY_ID } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: aws, key: AWS_SECRET_ACCESS_KEY } }
                # rustfs mirror target (#116). Deliberately NOT named AWS_* — the
                # consolidation work above binds those to the `aws` secret for the NRP
                # source, and reusing the names would overwrite the source credential
                # and break the job before it ever mirrored anything.
                # `optional: true` throughout: a cluster without the secret still
                # consolidates, and the mirror step reports itself skipped.
                - name: RUSTFS_KEY
                  valueFrom:
                    secretKeyRef: { name: rustfs-logs-write, key: AWS_ACCESS_KEY_ID, optional: true }
                - name: RUSTFS_SECRET
                  valueFrom:
                    secretKeyRef: { name: rustfs-logs-write, key: AWS_SECRET_ACCESS_KEY, optional: true }
                - name: RUSTFS_ENDPOINT
                  valueFrom:
                    secretKeyRef: { name: rustfs-logs-write, key: AWS_S3_ENDPOINT, optional: true }
                - name: RUSTFS_BUCKET
                  valueFrom:
                    secretKeyRef: { name: rustfs-logs-write, key: BUCKET, optional: true }
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  pip install --quiet duckdb boto3
                  python - <<'PY'
                  import os, datetime, boto3, duckdb
                  from botocore.client import Config
                  from botocore.exceptions import ClientError

                  BUCKET   = 'logs-open-llm-proxy'
                  ENDPOINT = 'http://rook-ceph-rgw-nautiluss3.rook'

                  s3 = boto3.client(
                      's3',
                      endpoint_url=ENDPOINT,
                      aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],
                      aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],
                      config=Config(s3={'addressing_style': 'path'}),
                  )

                  today = datetime.datetime.utcnow().date().isoformat()
                  paginator = s3.get_paginator('list_objects_v2')

                  # Discover all YYYY-MM-DD/ prefixes at the bucket root
                  date_prefixes = set()
                  for page in paginator.paginate(Bucket=BUCKET, Delimiter='/'):
                      for p in page.get('CommonPrefixes', []):
                          pref = p['Prefix'].rstrip('/')
                          try:
                              datetime.date.fromisoformat(pref)
                              date_prefixes.add(pref)
                          except ValueError:
                              pass

                  def _parquet_days(prefix):
                      days = set()
                      for page in paginator.paginate(Bucket=BUCKET, Prefix=prefix):
                          for obj in page.get('Contents', []):
                              name = obj['Key'].split('/')[-1]
                              if name.endswith('.parquet'):
                                  days.add(name[:-len('.parquet')])
                      return days

                  # Existing consolidated daily Parquet files, and existing session views
                  existing          = _parquet_days('consolidated/daily/')
                  existing_sessions = _parquet_days('sessions/daily/')
                  existing_rollups  = _parquet_days('session-rollup/daily/')

                  to_do = sorted(d for d in date_prefixes if d != today and d not in existing)
                  # Days already consolidated but missing a session view (e.g. files
                  # written before the session view existed) — backfill from Parquet.
                  backfill_sessions = sorted(existing - existing_sessions - set(to_do))
                  # Rollups derive from the turn view, so a day needs one only once it
                  # has a session view; days queued for a fresh session view get their
                  # rollup in that same pass.
                  backfill_rollups = sorted(existing_sessions - existing_rollups - set(to_do))
                  print(f"Days to consolidate ({len(to_do)}): {to_do}")
                  print(f"Session views to backfill ({len(backfill_sessions)}): {backfill_sessions}")
                  print(f"Session rollups to backfill ({len(backfill_rollups)}): {backfill_rollups}")
                  # Note: we always continue to the schema-upgrade pass below, which
                  # re-flattens any legacy consolidated daily file — it must run even on
                  # days with nothing new to consolidate or backfill.

                  con = duckdb.connect()
                  # In a container DuckDB sees every node core and spawns that many
                  # worker threads — each with its own buffers — while CPU is throttled
                  # to the pod request, so memory balloons and OOMs the pod. Pin a small
                  # thread count and drop insertion-order buffering to keep COPY/sort
                  # memory bounded (the data is re-sorted by ts on read anyway).
                  con.execute("SET threads=2")
                  con.execute("SET preserve_insertion_order=false")
                  # Cap DuckDB below the pod limit, and give it somewhere to spill.
                  #
                  # The daily job wedged for 9 days OOMing at 819/819 MiB building one
                  # session view, which blocked the reflatten pass and everything after
                  # it. Headroom is the primary fix; `temp_directory` is a margin, not a
                  # cure. Measured on a session-view-shaped build (window function +
                  # self-join over a wide payload): with spill off it failed at 500MB
                  # and 1GB and passed at 2GB; with spill on it passed at 500MB. At a
                  # hard-tight budget (200MB) both still failed — DuckDB does not spill
                  # every operator. So raise the ceiling *and* allow spilling.
                  con.execute("SET memory_limit='3GB'")
                  con.execute("SET temp_directory='/tmp/duckdb-spill'")
                  con.execute(f"""
                      CREATE SECRET s3_logs (
                          TYPE S3,
                          KEY_ID '{os.environ["AWS_ACCESS_KEY_ID"]}',
                          SECRET '{os.environ["AWS_SECRET_ACCESS_KEY"]}',
                          ENDPOINT 'rook-ceph-rgw-nautiluss3.rook',
                          USE_SSL false,
                          URL_STYLE 'path'
                      )
                  """)

                  # Materialize the per-turn session view from a consolidated Parquet
                  # glob (one row per request_id = one turn, request joined to its
                  # response). Reads only the raw `entry` JSON via json_extract_string
                  # / json_extract — the cast-safe access form — so it works on both
                  # legacy (entry-only) and new (flattened) consolidated files.
                  # turn_idx is assigned within `src` ordered by ts; for the daily
                  # tier that means within-day (a session spanning UTC midnight
                  # restarts at 1 in the next day's file — ordering by ts is still
                  # correct, only the index resets). The monthly rollup recomputes it
                  # over the whole month.
                  def build_session_view(src, dest):
                      con.execute(f"""
                          COPY (
                              WITH base AS (
                                  SELECT ts, type, request_id, origin,
                                      json_extract_string(entry,'$.session_id')    AS session_id,
                                      json_extract_string(entry,'$.client')        AS client,
                                      json_extract_string(entry,'$.provider')      AS provider,
                                      json_extract_string(entry,'$.model')         AS model,
                                      TRY_CAST(json_extract_string(entry,'$.message_count') AS INTEGER) AS message_count,
                                      TRY_CAST(json_extract_string(entry,'$.enable_thinking') AS BOOLEAN) AS enable_thinking,
                                      json_extract_string(entry,'$.user_question') AS user_question,
                                      json_extract_string(entry,'$.user_message_this_turn') AS user_message_this_turn,
                                      json_extract(entry,'$.tool_results_this_turn') AS tool_results,
                                      TRY_CAST(json_extract_string(entry,'$.latency_ms') AS BIGINT) AS latency_ms,
                                      TRY_CAST(json_extract_string(entry,'$.has_tool_calls') AS BOOLEAN) AS has_tool_calls,
                                      TRY_CAST(json_extract_string(entry,'$.has_content')   AS BOOLEAN) AS has_content,
                                      json_extract(entry,'$.tool_calls')           AS tool_calls,
                                      json_extract(entry,'$.tokens')               AS tokens,
                                      json_extract_string(entry,'$.content')       AS assistant_content,
                                      json_extract_string(entry,'$.reasoning_content') AS reasoning_content,
                                      json_extract_string(entry,'$.error')         AS error
                                  FROM read_parquet('{src}')
                              ),
                              keyed AS (
                                  SELECT *, COALESCE(session_id,
                                      'anon:' || md5(COALESCE(origin,'') || '|' || COALESCE(user_question,''))) AS session_key
                                  FROM base WHERE type='request'
                              ),
                              req AS (
                                  SELECT session_key, session_id, request_id, ts, origin, client, provider, model,
                                         user_question, user_message_this_turn, message_count, enable_thinking, tool_results,
                                         ROW_NUMBER() OVER (PARTITION BY session_key ORDER BY ts, request_id) AS turn_idx
                                  FROM keyed
                              ),
                              resp AS (
                                  SELECT request_id, ts AS response_ts, latency_ms, has_tool_calls, has_content,
                                         tool_calls, tokens, assistant_content, reasoning_content, error
                                  FROM base WHERE type='response'
                              )
                              SELECT req.session_key, req.session_id, req.turn_idx,
                                     req.ts AS request_ts, resp.response_ts, req.request_id,
                                     req.origin, req.client, req.provider, req.model,
                                     req.user_question, req.user_message_this_turn, req.message_count, req.enable_thinking, req.tool_results,
                                     resp.assistant_content, resp.reasoning_content, resp.tool_calls,
                                     resp.has_tool_calls, resp.has_content, resp.latency_ms, resp.tokens, resp.error
                              FROM req LEFT JOIN resp USING (request_id)
                              ORDER BY req.session_key, req.turn_idx
                          ) TO '{dest}' (FORMAT PARQUET, COMPRESSION zstd)
                      """)

                  # Materialize the per-SESSION rollup (#51) from a per-turn session
                  # view: one row per session, with the mechanical stats every
                  # experiment and monitoring question re-derives by hand today
                  # (calls-per-question, cost-per-question, completion-rate-per-model).
                  # Built from `sessions/**`, not `consolidated/**` — the turn view has
                  # already done the request/response join and the session keying, so
                  # this is a plain GROUP BY and stays cheap.
                  #
                  # Session-level identity columns (origin/app/model/provider/client)
                  # are taken from the FIRST turn: for an experiment that is "what the
                  # run was launched with". `models_used` exposes when a session did not
                  # stay on one model (~3% do not, via fallback ladders), so a
                  # single-model GROUP BY cannot silently mis-attribute one.
                  #
                  # Token/cost columns sum across ALL turns. `cost` is only reported by
                  # OpenRouter; NRP/nimbus are self-hosted and Anthropic-direct does not
                  # return it, so cost_usd is NULL rather than 0 where nothing reported
                  # one — "no price data" must not read as "free". `cost_turns` gives the
                  # coverage, so partial-cost sessions are detectable.
                  # Columns the rollup reads out of the turn view. That view has
                  # gained columns over time (user_message_this_turn in #89), so a
                  # legacy monthly view can lack one and the build dies on a bare
                  # binder error mid-backfill. Substitute NULL for whatever is absent
                  # instead of special-casing each column, so the next turn-view
                  # addition does not re-break this the same way.
                  ROLLUP_INPUTS = ('session_key', 'session_id', 'turn_idx', 'request_ts',
                                   'response_ts', 'origin', 'client', 'provider', 'model',
                                   'user_question', 'user_message_this_turn',
                                   'assistant_content', 'tool_calls', 'latency_ms',
                                   'tokens', 'error')

                  def build_session_rollup(src, dest):
                      have = {r[0] for r in con.execute(
                          f"DESCRIBE SELECT * FROM read_parquet('{src}')").fetchall()}
                      cols = ', '.join(c if c in have else f'NULL AS {c}' for c in ROLLUP_INPUTS)
                      missing = [c for c in ROLLUP_INPUTS if c not in have]
                      if missing:
                          print(f"  ℹ️  {src}: turn view predates {missing} — filled as NULL")
                      con.execute(f"""
                          COPY (
                              WITH t AS (
                                  SELECT *,
                                      regexp_extract(origin, '^https?://([^./:]+)', 1)              AS app,
                                      NULLIF(regexp_extract(origin, '^https?://[^/]+(/.*)$', 1),'') AS run_tag,
                                      TRY_CAST(json_extract_string(tokens,'$.prompt_tokens')     AS BIGINT) AS pt,
                                      TRY_CAST(json_extract_string(tokens,'$.completion_tokens') AS BIGINT) AS ct,
                                      TRY_CAST(json_extract_string(tokens,'$.total_tokens')      AS BIGINT) AS tt,
                                      TRY_CAST(json_extract_string(tokens,'$.prompt_tokens_details.cached_tokens') AS BIGINT) AS cached,
                                      TRY_CAST(json_extract_string(tokens,'$.cost')              AS DOUBLE) AS cost,
                                      CASE WHEN tool_calls IS NULL THEN 0
                                           ELSE COALESCE(json_array_length(tool_calls), 0) END AS n_tool_calls
                                  FROM (SELECT {cols} FROM read_parquet('{src}'))
                              ),
                              ranked AS (
                                  SELECT *,
                                      ROW_NUMBER() OVER (PARTITION BY session_key ORDER BY request_ts, turn_idx)           AS asc_rn,
                                      ROW_NUMBER() OVER (PARTITION BY session_key ORDER BY request_ts DESC, turn_idx DESC) AS desc_rn,
                                      ROW_NUMBER() OVER (PARTITION BY session_key,
                                                                      (assistant_content IS NOT NULL AND assistant_content <> '')
                                                         ORDER BY request_ts DESC, turn_idx DESC)                          AS ans_rn
                                  FROM t
                              )
                              SELECT
                                  session_key,
                                  any_value(session_id)                                        AS session_id,
                                  -- The turn view keys anonymous traffic as anon:<hash of
                                  -- origin|user_question>, which groups EVERY repeat of the
                                  -- same question into one pseudo-session. Harmless per-turn;
                                  -- at session grain it inflates `turns` and can stretch
                                  -- wall_clock_s across months. Flagged, not silently mixed in.
                                  session_key LIKE 'anon:%'                                    AS session_key_synthetic,
                                  any_value(origin)   FILTER (WHERE asc_rn = 1)                AS origin,
                                  any_value(app)      FILTER (WHERE asc_rn = 1)                AS app,
                                  any_value(run_tag)  FILTER (WHERE asc_rn = 1)                AS run_tag,
                                  any_value(client)   FILTER (WHERE asc_rn = 1)                AS client,
                                  any_value(model)    FILTER (WHERE asc_rn = 1)                AS model,
                                  any_value(provider) FILTER (WHERE asc_rn = 1)                AS provider,
                                  count(DISTINCT model)                                        AS models_used,
                                  any_value(COALESCE(user_message_this_turn, user_question))
                                                      FILTER (WHERE asc_rn = 1)                AS question,
                                  count(*)                                                     AS turns,
                                  CAST(SUM(n_tool_calls) AS BIGINT)                            AS tool_calls_total,
                                  CAST(SUM(pt) AS BIGINT)                                      AS prompt_tokens,
                                  CAST(SUM(ct) AS BIGINT)                                      AS completion_tokens,
                                  CAST(SUM(cached) AS BIGINT)                                  AS cached_tokens,
                                  CAST(SUM(tt) AS BIGINT)                                      AS total_tokens,
                                  SUM(cost)                                                    AS cost_usd,
                                  count(*) FILTER (WHERE cost IS NOT NULL)                     AS cost_turns,
                                  CAST(SUM(latency_ms) AS BIGINT)                              AS llm_ms_total,
                                  date_diff('ms', MIN(request_ts),
                                            MAX(COALESCE(response_ts, request_ts))) / 1000.0   AS wall_clock_s,
                                  count(*) FILTER (WHERE error IS NOT NULL)                    AS error_turns,
                                  count(*) FILTER (WHERE response_ts IS NULL)                  AS unanswered_turns,
                                  -- Status describes how the session ENDED (the issue's
                                  -- "did it complete?"), so a recovered mid-session failure
                                  -- still reads `ok`; error_turns is what exposes it.
                                  CASE
                                      -- Tested BEFORE 'ok', because a turn with no response
                                      -- row has a NULL error and would otherwise read as a
                                      -- success. It is the opposite: the request was logged
                                      -- and nothing ever came back — proxy died, client hung
                                      -- up, or one side of the pair was dropped, the
                                      -- half-record failure #39/#121 exists for. Measured on
                                      -- the corpus at 251 sessions, ~5% of everything that
                                      -- would otherwise be labelled 'ok'.
                                      WHEN any_value(response_ts) FILTER (WHERE desc_rn = 1) IS NULL THEN 'incomplete'
                                      WHEN any_value(error) FILTER (WHERE desc_rn = 1) IS NULL THEN 'ok'
                                      WHEN any_value(error) FILTER (WHERE desc_rn = 1) ILIKE '%timed out%' THEN 'timeout'
                                      WHEN any_value(error) FILTER (WHERE desc_rn = 1) ILIKE '%budget limit exceeded%'
                                        OR any_value(error) FILTER (WHERE desc_rn = 1) ILIKE '%credit balance is too low%'
                                        OR any_value(error) FILTER (WHERE desc_rn = 1) ILIKE '%requires more credits%' THEN 'budget_capped'
                                      ELSE 'error'
                                  END                                                          AS status,
                                  any_value(error) FILTER (WHERE desc_rn = 1)                  AS final_error,
                                  any_value(assistant_content) FILTER (
                                      WHERE ans_rn = 1
                                        AND assistant_content IS NOT NULL
                                        AND assistant_content <> '')                           AS final_answer,
                                  MIN(request_ts)                                              AS started_at,
                                  MAX(COALESCE(response_ts, request_ts))                       AS finished_at
                              FROM ranked
                              GROUP BY session_key
                              ORDER BY started_at
                          ) TO '{dest}' (FORMAT PARQUET, COMPRESSION zstd)
                      """)

                  # Upgrade a legacy (entry-only, 5-column) consolidated Parquet file
                  # to the flattened wide schema in place, reconstructing the typed
                  # columns from its own `entry` blob. Lossless (`entry` is preserved
                  # verbatim) and idempotent: a no-op once the file already has the
                  # wide schema. Keeps the whole consolidated/** corpus on one schema so
                  # legacy and new files compose in a single glob without union_by_name
                  # and without the "column not found" gap on the new flat columns.
                  # Materializes to a TEMP table first so the read completes before the
                  # COPY overwrites the source key.
                  def reflatten(path):
                      cols = [r[0] for r in con.execute(f"DESCRIBE SELECT * FROM read_parquet('{path}')").fetchall()]
                      # Sentinel = the newest flat column. Guarding on the latest-added
                      # column (not just 'model') re-flattens wide-but-stale files when a
                      # new column lands, keeping consolidated/** on one schema so the glob
                      # composes without union_by_name (see the flatten note below).
                      if 'user_message_this_turn' in cols:
                          return False
                      con.execute(f"""
                          CREATE OR REPLACE TEMP TABLE _wide AS
                          SELECT ts, type, request_id,
                                 json_extract_string(entry,'$.session_id')    AS session_id,
                                 origin,
                                 json_extract_string(entry,'$.client')        AS client,
                                 json_extract_string(entry,'$.provider')      AS provider,
                                 json_extract_string(entry,'$.model')         AS model,
                                 TRY_CAST(json_extract_string(entry,'$.message_count') AS INTEGER) AS message_count,
                                 TRY_CAST(json_extract_string(entry,'$.tools_count')   AS INTEGER) AS tools_count,
                                 TRY_CAST(json_extract_string(entry,'$.enable_thinking') AS BOOLEAN) AS enable_thinking,
                                 json_extract_string(entry,'$.user_question') AS user_question,
                                 json_extract_string(entry,'$.user_message_this_turn') AS user_message_this_turn,
                                 TRY_CAST(json_extract_string(entry,'$.latency_ms') AS BIGINT) AS latency_ms,
                                 TRY_CAST(json_extract_string(entry,'$.has_tool_calls') AS BOOLEAN) AS has_tool_calls,
                                 TRY_CAST(json_extract_string(entry,'$.has_content')   AS BOOLEAN) AS has_content,
                                 json_extract(entry, '$.tool_calls')             AS tool_calls,
                                 json_extract(entry, '$.tool_results_this_turn')  AS tool_results,
                                 json_extract(entry, '$.tokens')                  AS tokens,
                                 json_extract_string(entry,'$.error')         AS error,
                                 entry
                          FROM read_parquet('{path}')
                          ORDER BY ts
                      """)
                      con.execute(f"COPY _wide TO '{path}' (FORMAT PARQUET, COMPRESSION zstd)")
                      return True

                  for day in to_do:
                      print(f"→ {day}")
                      # Flatten the hot fields to typed columns alongside the raw
                      # `entry` blob (kept verbatim for fidelity). Direct queries no
                      # longer need entry::JSON-> casting; `entry` is still there.
                      con.execute(f"""
                          COPY (
                              SELECT (json->>'timestamp')::TIMESTAMPTZ            AS ts,
                                     json->>'type'                                AS type,
                                     json->>'request_id'                          AS request_id,
                                     json->>'session_id'                          AS session_id,
                                     json->>'origin'                              AS origin,
                                     json->>'client'                              AS client,
                                     json->>'provider'                            AS provider,
                                     json->>'model'                               AS model,
                                     TRY_CAST(json->>'message_count' AS INTEGER)  AS message_count,
                                     TRY_CAST(json->>'tools_count'   AS INTEGER)  AS tools_count,
                                     TRY_CAST(json->>'enable_thinking' AS BOOLEAN) AS enable_thinking,
                                     json->>'user_question'                       AS user_question,
                                     json->>'user_message_this_turn'              AS user_message_this_turn,
                                     TRY_CAST(json->>'latency_ms' AS BIGINT)      AS latency_ms,
                                     TRY_CAST(json->>'has_tool_calls' AS BOOLEAN) AS has_tool_calls,
                                     TRY_CAST(json->>'has_content'    AS BOOLEAN) AS has_content,
                                     json_extract(json, '$.tool_calls')              AS tool_calls,
                                     json_extract(json, '$.tool_results_this_turn')  AS tool_results,
                                     json_extract(json, '$.tokens')                  AS tokens,
                                     json->>'error'                               AS error,
                                     json::VARCHAR                                AS entry
                              FROM read_ndjson_objects('s3://{BUCKET}/{day}/*.jsonl')
                              ORDER BY ts
                          ) TO 's3://{BUCKET}/consolidated/daily/{day}.parquet'
                            (FORMAT PARQUET, COMPRESSION zstd)
                      """)
                      # Verify Parquet exists before destroying inputs
                      s3.head_object(Bucket=BUCKET, Key=f'consolidated/daily/{day}.parquet')
                      # Build the per-turn session view from the just-written Parquet.
                      build_session_view(f's3://{BUCKET}/consolidated/daily/{day}.parquet',
                                         f's3://{BUCKET}/sessions/daily/{day}.parquet')
                      s3.head_object(Bucket=BUCKET, Key=f'sessions/daily/{day}.parquet')
                      # Per-session rollup, derived from the turn view just written.
                      build_session_rollup(f's3://{BUCKET}/sessions/daily/{day}.parquet',
                                           f's3://{BUCKET}/session-rollup/daily/{day}.parquet')
                      s3.head_object(Bucket=BUCKET, Key=f'session-rollup/daily/{day}.parquet')
                      to_delete = []
                      for page in paginator.paginate(Bucket=BUCKET, Prefix=f'{day}/'):
                          for obj in page.get('Contents', []):
                              to_delete.append({'Key': obj['Key']})
                      for i in range(0, len(to_delete), 1000):
                          s3.delete_objects(Bucket=BUCKET, Delete={'Objects': to_delete[i:i+1000]})
                      print(f"  ✓ {len(to_delete)} JSONL chunks removed; session view + rollup written")

                  # Isolate per day. A single oversized day used to abort the whole
                  # run before the reflatten pass and the rustfs mirror, and it stayed
                  # on the backfill list, so it re-broke the job every night. Now one
                  # bad day is recorded and skipped; the rest of the pipeline completes
                  # and the job still exits non-zero at the end (see `failed` below),
                  # so the failure is loud rather than silently tolerated.
                  failed_days = []
                  for day in backfill_sessions:
                      print(f"↺ backfill session view: {day}")
                      try:
                          build_session_view(f's3://{BUCKET}/consolidated/daily/{day}.parquet',
                                             f's3://{BUCKET}/sessions/daily/{day}.parquet')
                          # A day that just got its turn view needs the rollup too, and
                          # would otherwise wait a full day for the next run to notice.
                          build_session_rollup(f's3://{BUCKET}/sessions/daily/{day}.parquet',
                                               f's3://{BUCKET}/session-rollup/daily/{day}.parquet')
                      except Exception as e:
                          print(f"  ✗ session view failed for {day}: {type(e).__name__}: {e}")
                          failed_days.append(day)

                  # Rollup-only backfill: days that already had a turn view before this
                  # tier existed. Isolated per day for the same reason as above — one
                  # bad day must not abort the reflatten pass or the rustfs mirror.
                  failed_rollups = []
                  for day in backfill_rollups:
                      print(f"↺ backfill session rollup: {day}")
                      try:
                          build_session_rollup(f's3://{BUCKET}/sessions/daily/{day}.parquet',
                                               f's3://{BUCKET}/session-rollup/daily/{day}.parquet')
                      except Exception as e:
                          print(f"  ✗ session rollup failed for {day}: {type(e).__name__}: {e}")
                          failed_rollups.append(day)

                  # -----------------------------------------------------------------
                  # Sweep orphaned raw JSONL.
                  #
                  # The consolidate path deletes `{day}/` inline, once both rollups are
                  # verified. Any day that does NOT go through that path keeps its raw
                  # JSONL forever: it lands in `existing`, so it can never re-enter
                  # `to_do`, and nothing else ever revisits it. The backfill loop above
                  # is exactly such a path.
                  #
                  # Not hypothetical — the 2026-08 OOM incident stranded 2026-08-07/08/12:
                  # 2,944 objects, 41.8 MiB, 65% of every raw object in the bucket, for
                  # days whose rollups had been complete for a week.
                  #
                  # Deliberately a SWEEP over the raw tier rather than a delete bolted
                  # onto the backfill loop. A backfill-local fix would prevent new
                  # orphans but never clear existing ones: once a day has its session
                  # view it drops out of `backfill_sessions` too, so the already-stranded
                  # days would stay stranded forever. Sweeping the actual state is
                  # self-healing and indifferent to how a day was orphaned.
                  #
                  # Same verify-before-destroy rule as everywhere else here: a day's raw
                  # goes only when BOTH rollups are confirmed present. Today is never
                  # touched — it is still being written.
                  raw_days = set()
                  for page in paginator.paginate(Bucket=BUCKET, Delimiter='/'):
                      for pre in page.get('CommonPrefixes', []):
                          d = pre['Prefix'].rstrip('/')
                          if len(d) == 10 and d[4] == '-' and d[7] == '-':
                              raw_days.add(d)
                  swept = 0
                  for day in sorted(raw_days - {today}):
                      try:
                          s3.head_object(Bucket=BUCKET, Key=f'consolidated/daily/{day}.parquet')
                          s3.head_object(Bucket=BUCKET, Key=f'sessions/daily/{day}.parquet')
                      except ClientError as e:
                          if e.response['Error']['Code'] in ('404', 'NoSuchKey', 'NotFound'):
                              continue      # not yet rolled up — leave it alone
                          raise
                      stale = []
                      for page in paginator.paginate(Bucket=BUCKET, Prefix=f'{day}/'):
                          for obj in page.get('Contents', []):
                              stale.append({'Key': obj['Key']})
                      for i in range(0, len(stale), 1000):
                          s3.delete_objects(Bucket=BUCKET, Delete={'Objects': stale[i:i+1000]})
                      swept += 1
                      print(f"  🧹 {day}: rollups complete, {len(stale)} orphaned JSONL chunks removed")
                  print(f"Orphaned raw day-prefixes swept: {swept}")

                  # Schema-upgrade pass: bring any legacy-schema consolidated daily file
                  # (current month — older months live in monthly files, upgraded by the
                  # monthly job) up to the wide schema. Self-healing no-op once uniform.
                  upgraded = 0
                  for day in sorted(_parquet_days('consolidated/daily/')):
                      if reflatten(f's3://{BUCKET}/consolidated/daily/{day}.parquet'):
                          upgraded += 1
                          print(f"  ⬆ re-flattened {day} to wide schema")
                  print(f"Legacy daily files upgraded to wide schema: {upgraded}")
                  # -----------------------------------------------------------------
                  # Mirror the query-ready tiers to rustfs (#116).
                  #
                  # Exists so log analysis can run on the read-only, single-bucket
                  # `logs-open-llm-proxy-reader` credential instead of the one NRP key,
                  # which carries read/write/delete on every NRP bucket (#113).
                  #
                  # NRP Ceph stays the system of record. rustfs sits on the *same* rook
                  # Ceph, so this is a convenience mirror, not a second failure domain,
                  # and must never become the only copy.
                  #
                  # Copy-only, never delete: an accidental source deletion must not
                  # propagate. True mirror semantics would need a --max-delete-style
                  # guard first (the writer identity can delete objects; this does not).
                  #
                  # Runs last, after every tier is written and verified, so a mirror
                  # failure cannot cost the consolidation work. It does fail the Job
                  # though — a mirror that quietly stops is a stale mirror nobody
                  # notices, and the reader would keep serving yesterday's answers.
                  # -----------------------------------------------------------------
                  def mirror_to_rustfs(prefixes=('consolidated/', 'sessions/', 'session-rollup/')):
                      key = os.environ.get('RUSTFS_KEY')
                      if not key:
                          print("ℹ️  RUSTFS_KEY not set — skipping rustfs mirror (#116)")
                          return
                      dest_bucket = os.environ.get('RUSTFS_BUCKET') or BUCKET
                      rustfs = boto3.client(
                          's3',
                          endpoint_url=os.environ['RUSTFS_ENDPOINT'],
                          aws_access_key_id=key,
                          aws_secret_access_key=os.environ['RUSTFS_SECRET'],
                          config=Config(s3={'addressing_style': 'path'}),
                      )
                      copied = skipped = 0
                      for prefix in prefixes:
                          for page in paginator.paginate(Bucket=BUCKET, Prefix=prefix):
                              for obj in page.get('Contents', []):
                                  k, stamp = obj['Key'], obj['LastModified'].isoformat()
                                  # Re-upload whenever the source changed. Size alone is
                                  # not a witness: the reflatten pass rewrites files in
                                  # place and can land on an identical byte count.
                                  try:
                                      head = rustfs.head_object(Bucket=dest_bucket, Key=k)
                                      if (head['Metadata'].get('src-mtime') == stamp
                                              and head['ContentLength'] == obj['Size']):
                                          skipped += 1
                                          continue
                                  except ClientError as e:
                                      if e.response['Error']['Code'] not in ('404', 'NoSuchKey', 'NotFound'):
                                          raise   # 403 etc. is a real problem — be loud
                                  body = s3.get_object(Bucket=BUCKET, Key=k)['Body'].read()
                                  rustfs.put_object(Bucket=dest_bucket, Key=k, Body=body,
                                                    Metadata={'src-mtime': stamp})
                                  copied += 1
                      print(f"rustfs mirror → {dest_bucket}: {copied} copied, {skipped} already current")

                  mirror_to_rustfs()

                  if failed_days or failed_rollups:
                      raise SystemExit(
                          f"session view build failed for {len(failed_days)} day(s): "
                          f"{failed_days}; session rollup failed for "
                          f"{len(failed_rollups)} day(s): {failed_rollups} — "
                          f"consolidation, reflatten and the rustfs mirror completed "
                          f"for everything else")
                  print("Done.")
                  PY
              resources:
                requests:
                  cpu: "500m"
                  memory: "4Gi"
                  ephemeral-storage: "8Gi"
                limits:
                  cpu: "500m"
                  memory: "4Gi"
                  ephemeral-storage: "8Gi"
