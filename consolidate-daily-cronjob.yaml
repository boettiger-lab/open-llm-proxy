apiVersion: batch/v1
kind: CronJob
metadata:
  name: logs-consolidate-daily
  labels:
    app: logs-consolidate
spec:
  # 03:00 UTC every day — consolidates each completed YYYY-MM-DD/ directory
  # of JSONL chunks into one consolidated/daily/YYYY-MM-DD.parquet and deletes
  # the originals. Idempotent: skips days that already have a Parquet and
  # always skips today (still being written).
  #
  # The logic lives in consolidate_logs.py in this repo (git-cloned at start),
  # NOT inline here, so this job and the cirrus one (cirrus/) run the same code
  # and differ only in env. Editing the script changes both on the next run.
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          priorityClassName: opportunistic
          restartPolicy: Never
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: feature.node.kubernetes.io/pci-10de.present
                        operator: NotIn
                        values: ["true"]
          initContainers:
            - name: git-sync
              image: alpine/git:latest
              command:
                - sh
                - -c
                - git clone --depth 1 https://github.com/boettiger-lab/open-llm-proxy.git /app
              volumeMounts:
                - name: app-code
                  mountPath: /app
          containers:
            - name: consolidate
              image: python:3.12-slim
              workingDir: /app
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: aws, key: AWS_ACCESS_KEY_ID } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: aws, key: AWS_SECRET_ACCESS_KEY } }
                # NRP: Rook/Ceph RGW, in-cluster plain HTTP, path-style.
                - name: LOG_BUCKET
                  value: "logs-open-llm-proxy"
                - name: S3_ENDPOINT_URL
                  value: "http://rook-ceph-rgw-nautiluss3.rook"
                - name: S3_URL_STYLE
                  value: "path"
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  pip install --quiet duckdb boto3
                  python consolidate_logs.py --tier daily
              volumeMounts:
                - name: app-code
                  mountPath: /app
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "500m"
                  memory: "1Gi"
          volumes:
            - name: app-code
              emptyDir: {}
