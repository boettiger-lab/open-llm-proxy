# Second NRP deployment of open-llm-proxy, in the schmidtdse namespace.
#
# It reuses the root manifests unchanged and patches only what names the
# namespace. Root files sit outside this directory, so kustomize needs the load
# restrictor lifted, which `kubectl apply -k` cannot do:
#
#   kubectl kustomize --load-restrictor LoadRestrictionsNone schmidtdse \
#     | kubectl -n schmidtdse apply -f -
#
# See README.md in this directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: schmidtdse

resources:
  - ../deployment.yaml
  - ../service.yaml
  - ../redis.yaml
  - ../dns-cache-configmap.yaml
  - ../consolidate-daily-cronjob.yaml
  - ../consolidate-monthly-cronjob.yaml

patches:
  - target:
      kind: Deployment
      name: open-llm-proxy
    patch: |-
      # Lighter traffic than biodiversity: two replicas still survive one bad node.
      - op: replace
        path: /spec/replicas
        value: 2
      # The first DNS search domain is the pod's own namespace.
      - op: replace
        path: /spec/template/spec/dnsConfig/searches/0
        value: schmidtdse.svc.cluster.local
  - target:
      kind: Deployment
      name: open-llm-proxy
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: open-llm-proxy
      spec:
        template:
          spec:
            containers:
            - name: open-llm-proxy
              env:
              # Budget counters are per deployment: this redis, not biodiversity's.
              # The merge moves patched entries to the front of the env list, and
              # $(VAR) only expands variables defined earlier, so the password is
              # repeated here, ahead of the URL that uses it.
              - name: BUDGET_REDIS_PASSWORD
                valueFrom: { secretKeyRef: { name: open-llm-proxy-secrets, key: redis-password, optional: true } }
              - name: BUDGET_REDIS_URL
                value: "redis://:$(BUDGET_REDIS_PASSWORD)@open-llm-proxy-redis.schmidtdse.svc.cluster.local:6379/0"
              # Logs go to this deployment's own rustfs bucket, with a key scoped
              # to that bucket (rustfs-logs-write), never the general NRP key.
              - name: AWS_ACCESS_KEY_ID
                valueFrom: { secretKeyRef: { name: rustfs-logs-write, key: AWS_ACCESS_KEY_ID } }
              - name: AWS_SECRET_ACCESS_KEY
                valueFrom: { secretKeyRef: { name: rustfs-logs-write, key: AWS_SECRET_ACCESS_KEY } }
              - name: LOG_BUCKET
                valueFrom: { secretKeyRef: { name: rustfs-logs-write, key: BUCKET } }
              - name: AWS_S3_ENDPOINT_URL
                valueFrom: { secretKeyRef: { name: rustfs-logs-write, key: AWS_S3_ENDPOINT } }
  - target:
      kind: CronJob
      name: logs-consolidate-daily
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: logs-consolidate-daily
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                - name: consolidate
                  env:
                  # Logs go to this deployment's own rustfs bucket, with a key scoped
                  # to that bucket (rustfs-logs-write), never the general NRP key.
                  - name: AWS_ACCESS_KEY_ID
                    valueFrom: { secretKeyRef: { name: rustfs-logs-write, key: AWS_ACCESS_KEY_ID } }
                  - name: AWS_SECRET_ACCESS_KEY
                    valueFrom: { secretKeyRef: { name: rustfs-logs-write, key: AWS_SECRET_ACCESS_KEY } }
                  - name: LOG_BUCKET
                    valueFrom: { secretKeyRef: { name: rustfs-logs-write, key: BUCKET } }
                  - name: LOG_S3_ENDPOINT
                    valueFrom: { secretKeyRef: { name: rustfs-logs-write, key: AWS_S3_ENDPOINT } }
  - target:
      kind: CronJob
      name: logs-consolidate-monthly
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: logs-consolidate-monthly
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                - name: rollup
                  env:
                  # Logs go to this deployment's own rustfs bucket, with a key scoped
                  # to that bucket (rustfs-logs-write), never the general NRP key.
                  - name: AWS_ACCESS_KEY_ID
                    valueFrom: { secretKeyRef: { name: rustfs-logs-write, key: AWS_ACCESS_KEY_ID } }
                  - name: AWS_SECRET_ACCESS_KEY
                    valueFrom: { secretKeyRef: { name: rustfs-logs-write, key: AWS_SECRET_ACCESS_KEY } }
                  - name: LOG_BUCKET
                    valueFrom: { secretKeyRef: { name: rustfs-logs-write, key: BUCKET } }
                  - name: LOG_S3_ENDPOINT
                    valueFrom: { secretKeyRef: { name: rustfs-logs-write, key: AWS_S3_ENDPOINT } }
