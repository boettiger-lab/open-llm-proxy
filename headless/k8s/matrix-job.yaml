apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  labels:
    app: headless-matrix
    matrix-tag: ${TAG}
    matrix-app: ${APP_NAME}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: headless-matrix
        matrix-tag: ${TAG}
        matrix-app: ${APP_NAME}
    spec:
      priorityClassName: opportunistic
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values: ["true"]
      containers:
        - name: matrix
          image: node:24-bookworm-slim
          env:
            - name: PROXY_KEY
              valueFrom:
                secretKeyRef:
                  name: open-llm-proxy-secrets
                  key: proxy-key
            - name: APP_REPO
              value: "${APP_REPO}"
            - name: APP_BRANCH
              value: "${APP_BRANCH}"
            - name: GEO_AGENT_BRANCH
              value: "${GEO_AGENT_BRANCH}"
            - name: APP_NAME
              value: "${APP_NAME}"
            - name: ORIGIN
              value: "${ORIGIN}"
            - name: TRIALS
              value: "${TRIALS}"
            - name: MAX_TURNS
              value: "${MAX_TURNS}"
            - name: MODELS
              value: "${MODELS}"
            - name: ENABLE_THINKING
              value: "${ENABLE_THINKING}"
            - name: MCP_URL
              value: "${MCP_URL}"
            - name: QUESTIONS_B64
              value: "${QUESTIONS_B64}"
            - name: SYSTEM_PROMPT_APPEND_B64
              value: "${SYSTEM_PROMPT_APPEND_B64}"
            - name: JOB_NAME
              value: "${JOB_NAME}"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "=== headless matrix job: $JOB_NAME ==="
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                  git ca-certificates python3 python3-yaml >/dev/null

              # Clone repos into the sibling layout the headless runner expects:
              #   /work/open-llm-proxy   /work/geo-agent   /work/<APP_NAME>
              mkdir -p /work && cd /work
              git clone --depth 1 https://github.com/boettiger-lab/open-llm-proxy.git
              # geo-agent supplies the framework (Agent / DatasetCatalog /
              # ToolRegistry / createMapTools) the runner imports. Pin its branch
              # to A/B-test code-level changes (e.g. tool-description variants)
              # before they ship in a release the fleet pins.
              git clone --depth 1 --branch "$GEO_AGENT_BRANCH" \
                  https://github.com/boettiger-lab/geo-agent.git
              git clone --depth 1 --branch "$APP_BRANCH" \
                  "https://github.com/$APP_REPO.git" "$APP_NAME"

              # Record the exact stack this run used, as a single grep-able line, so
              # downstream tooling (e.g. geo-agent-benchmark/scripts/collect_run.py) can
              # populate a reproducible versions block. SHAs come from the shallow clones;
              # mcp_url from the app config. Non-allowlisted $vars survive envsubst and
              # run in-pod. Purely additive — does not affect the matrix run.
              GEO_SHA="$(git -C /work/geo-agent rev-parse HEAD 2>/dev/null || echo unknown)"
              APP_SHA="$(git -C "/work/$APP_NAME" rev-parse HEAD 2>/dev/null || echo unknown)"
              PROXY_SHA="$(git -C /work/open-llm-proxy rev-parse HEAD 2>/dev/null || echo unknown)"
              # The reported mcp_url is the one the run will actually use: the MCP_URL
              # override when set, else the app config's. Keep it out of MCP_URL itself —
              # assigning the app value there would silently disable the override.
              APP_MCP_URL="$(python3 -c "import json,sys;print(json.load(open('/work/$APP_NAME/layers-input.json')).get('mcp_url',''))" 2>/dev/null || echo '')"
              EFFECTIVE_MCP_URL="${MCP_URL:-$APP_MCP_URL}"

              # Resolve what the MCP head is actually *running* (#103). mcp_url is stable
              # across MCP upgrades, so two runs with identical versions blocks can still
              # have hit different builds — which is why the server version was previously
              # passed by hand (`--mcp-server 'mcp-data-server v0.8.10'`) and went stale.
              # mcp-data-server serves a public, auth-exempt /version carrying the running
              # image's version + git SHA (mcp-data-server#221), so this resolves for any
              # head — NRP, dev, cirrus, a mirror — with no cluster access or RBAC. It also
              # reports what actually *serves*, unlike a pod imageID, which reads stale on
              # disrupted-node orphans (mcp-data-server#383).
              # Non-fatal, unlike the SHAs above: this is a network call to a third party,
              # and a transient failure must not burn a 130-cell matrix. It records the
              # explicit string "unknown" (visible downstream, not absent) and warns.
              MCP_SERVER=unknown
              MCP_GIT_SHA=unknown
              if [ -n "$EFFECTIVE_MCP_URL" ]; then
                  MCP_PROBE="$(python3 -c 'import json,sys,urllib.parse,urllib.request;u=urllib.parse.urlsplit(sys.argv[1]);r=urllib.parse.urlunsplit((u.scheme,u.netloc,"","",""));d=json.load(urllib.request.urlopen(r+"/version",timeout=20));print("%s|%s"%(d.get("version") or "unknown",d.get("git_sha") or "unknown"))' "$EFFECTIVE_MCP_URL" 2>/dev/null || echo '')"
                  if [ -n "$MCP_PROBE" ]; then
                      MCP_SERVER="mcp-data-server ${MCP_PROBE%%|*}"
                      MCP_GIT_SHA="${MCP_PROBE##*|}"
                  else
                      echo "WARNING: no /version from ${EFFECTIVE_MCP_URL} — MCP build recorded as unknown" >&2
                  fi
              fi

              # mcp_server fills a key collect_run.py already reads (it falls back to this
              # when --mcp-server isn't passed), so adding these two keys needs no change
              # downstream; every other consumer key is byte-identical to before.
              BENCH_VERSIONS="$(printf '##BENCH-VERSIONS## {"geo_agent":"%s","app_repo":"%s","app_sha":"%s","proxy_sha":"%s","mcp_url":"%s","mcp_server":"%s","mcp_git_sha":"%s","app_branch":"%s","geo_agent_branch":"%s"}' \
                  "$GEO_SHA" "$APP_REPO" "$APP_SHA" "$PROXY_SHA" "$EFFECTIVE_MCP_URL" "$MCP_SERVER" "$MCP_GIT_SHA" "$APP_BRANCH" "$GEO_AGENT_BRANCH")"

              # A run whose provenance is missing is not a valid measurement, so refuse
              # to spend the matrix on one (#103). On 2026-08-01 a 7-Job sweep emitted no
              # versions line at all and 130 graded cells were published with null SHAs —
              # unrecoverable after the fact, because the clones are gone. This is the last
              # point that can still see them. Fail here, before npm ci and the run.
              MISSING=""
              for pair in "geo_agent:$GEO_SHA" "app_sha:$APP_SHA" "proxy_sha:$PROXY_SHA"; do
                  case "${pair#*:}" in
                      ""|unknown) MISSING="$MISSING ${pair%%:*}" ;;
                  esac
              done
              if [ -n "$MISSING" ] || [ -z "$BENCH_VERSIONS" ]; then
                  echo "##BENCH-VERSIONS-MISSING## unresolved:${MISSING:- <printf produced nothing>}"
                  echo "ERROR: cannot establish stack provenance; refusing to run an" >&2
                  echo "       unreproducible benchmark. See open-llm-proxy#103." >&2
                  exit 1
              fi
              [ -n "$EFFECTIVE_MCP_URL" ] || \
                  echo "WARNING: mcp_url is empty (no MCP_URL override, none in layers-input.json)" >&2
              echo "$BENCH_VERSIONS"

              cd /work/open-llm-proxy/headless
              npm ci --no-audit --no-fund

              # PROXY_KEY → /tmp/proxy_key (run_matrix.sh reads from this path)
              printf %s "$PROXY_KEY" > /tmp/proxy_key

              # QUESTIONS_FILE: decode base64 blob from wrapper
              QFILE=/tmp/questions.txt
              echo "$QUESTIONS_B64" | base64 -d > "$QFILE"

              # SYSTEM_PROMPT_APPEND_B64: optional overlay for A/B-testing
              # guidance variants. Appended to the cloned app's system-prompt.md
              # so the original app-specific text stays in place.
              if [ -n "${SYSTEM_PROMPT_APPEND_B64:-}" ]; then
                  SP="/work/$APP_NAME/system-prompt.md"
                  echo "" >> "$SP"
                  echo "$SYSTEM_PROMPT_APPEND_B64" | base64 -d >> "$SP"
                  echo "--- system-prompt overlay applied (last 30 lines) ---"
                  tail -30 "$SP"
                  echo "----------------------------------------------------"
              fi

              echo "--- questions ---"
              cat "$QFILE"
              echo "--- models override: ${MODELS:-<from configmap>} ---"
              echo "--- mcp: $EFFECTIVE_MCP_URL ${MCP_URL:+(MCP_URL override)} ---"
              echo

              # Delegate to the existing matrix script. RUNS_DIR is pod-local;
              # transcripts are dumped to stdout below so kubectl logs captures them.
              RUNS_DIR_REL="runs/$JOB_NAME"
              rc=0
              QUESTIONS_FILE="$QFILE" \
              ORIGIN="$ORIGIN" \
              TRIALS="$TRIALS" \
              MAX_TURNS="$MAX_TURNS" \
              MODELS="$MODELS" \
              MCP_URL="$MCP_URL" \
              RUNS_DIR="$RUNS_DIR_REL" \
                  ./run_matrix.sh "/work/$APP_NAME" || rc=$?

              echo
              echo "=== per-cell transcripts (json) ==="
              for f in "$RUNS_DIR_REL"/*.json; do
                  [ -f "$f" ] || continue
                  echo "----- $(basename "$f") -----"
                  cat "$f"
                  echo
              done

              echo "=== summary.tsv ==="
              cat "$RUNS_DIR_REL/summary.tsv" 2>/dev/null || echo "(no summary written)"

              # Emit provenance a second time, in the trailer beside summary.tsv, so a
              # truncated or rotated log still carries it (#103). Consumers grep for the
              # marker and take either copy — the two are byte-identical.
              echo
              echo "$BENCH_VERSIONS"

              echo
              echo "=== filter proxy logs by origin: $ORIGIN ==="
              exit "$rc"
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "5Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "5Gi"
